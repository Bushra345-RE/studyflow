{% extends "base.html" %}
{% block title %}Register - StudyFlow{% endblock %}
{% block content %}
<div class="card narrow">
  <h1>Create account</h1>
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label>Username <input name="username" required minlength="3" maxlength="32"></label>
    <label>Password (min 8 characters) <input name="password" type="password" required minlength="8"></label>
    <button class="btn">Sign up</button>
  </form>
  <p>Already registered? <a href="{{ url_for('auth.login') }}">Log in</a></p>
</div>
{% endblock %}
