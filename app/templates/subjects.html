{% extends "base.html" %}
{% block title %}Subjects - StudyFlow{% endblock %}
{% block content %}
<h1>Subjects</h1>
<div class="card">
  <form method="post" class="row">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <input name="name" placeholder="e.g. Python, DBMS" required maxlength="60">
    <button class="btn">Add subject</button>
  </form>
</div>
<div class="card">
  {% for s in subjects %}
  <div class="row between">
    <span>{{ s.name }}</span>
    <form method="post" action="{{ url_for('main.delete_subject', subject_id=s.id) }}"
          onsubmit="return confirm('Delete this subject?')">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <button class="btn small danger">Delete</button>
    </form>
  </div>
  {% else %}
  <p>No subjects yet.</p>
  {% endfor %}
</div>
{% endblock %}
