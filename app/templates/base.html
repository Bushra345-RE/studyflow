<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}StudyFlow{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<header class="nav">
  <a class="brand" href="{{ url_for('main.index') }}">StudyFlow</a>
  {% if g.user %}
  <nav>
    <a href="{{ url_for('main.dashboard') }}">Dashboard</a>
    <a href="{{ url_for('main.tasks') }}">Tasks</a>
    <a href="{{ url_for('main.subjects') }}">Subjects</a>
    <form method="post" action="{{ url_for('auth.logout') }}" class="inline">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <button class="link">Log out ({{ g.user.username }})</button>
    </form>
  </nav>
  {% endif %}
</header>
<main class="container">
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for category, message in messages %}
      <div class="flash {{ category }}">{{ message }}</div>
    {% endfor %}
  {% endwith %}
  {% block content %}{% endblock %}
</main>
</body>
</html>
